apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.env.name }}
  namespace: {{ .Values.env.namespace }}
  labels:
    app: {{ .Values.env.name }}
    type: {{ .Values.env.type }}
    nucleus-client: "true"
    security.istio.io/tlsMode: "istio"
spec:
  serviceName: {{ .Values.env.name }}-headless
  replicas: {{ .Values.triton_inference_server.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.env.name }}
  # Allow parallel pod management for faster scaling
  podManagementPolicy: Parallel

  template:
    metadata:
      labels:
        app: {{ .Values.env.name }}
        type: {{ .Values.env.type }}
        nucleus-client: "true"
        security.istio.io/tlsMode: "istio"

    spec:
      serviceAccountName: {{ .Values.env.name }}-sa
      {{- if .Values.env.node_selector }}
      nodeSelector:
        dominodatalab.com/node-pool: {{ .Values.env.node_selector }}
      {{- end }}
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
      - name: triton
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - all
        image: {{ .Values.triton_inference_server.image }}

        env:
          - name: MODEL_REPO
            value: "/triton-repo/models"  # Used by Python backend models to find weights
          - name: HF_HOME
            value: "/triton-repo/hf-cache"  # HuggingFace cache directory (S3 EDV)
          - name: TRANSFORMERS_CACHE
            value: "/triton-repo/hf-cache"  # Transformers cache directory (S3 EDV)
          - name: NUMBA_CACHE_DIR
            value: "/tmp/numba_cache"  # vLLM/outlines: Numba JIT cache (site-packages not writable)
          - name: OUTLINES_CACHE_DIR
            value: "/tmp/outlines_cache"  # outlines: diskcache FSM cache (home dir not writable)
          - name: VLLM_NO_USAGE_STATS
            value: "1"                    # vLLM: disable usage stats (home dir not writable)
          - name: VLLM_WORKER_MULTIPROC_METHOD
            value: "spawn"                 # vLLM defaults to "fork" for its tensor-parallel worker
                                            # processes, which crashes as soon as the parent process
                                            # has touched CUDA ("Cannot re-initialize CUDA in forked
                                            # subprocess") -- only surfaces with tensor_parallel_size > 1
                                            # (i.e. multi-GPU models like the Llama4 Scout variants).
                                            # "spawn" avoids inheriting the parent's CUDA context.
          - name: CURL_CA_BUNDLE
            value: ""                     # Disable SSL verification for HuggingFace downloads
          - name: REQUESTS_CA_BUNDLE
            value: ""                     # Disable SSL verification for requests library
          # Pod name for placement tracking
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name

        # vllm_version_override (set in values-llama4scout-fp8.yaml only): this
        # image's bundled vLLM (0.8.1+nv25.04, from the
        # nvcr.io/nvidia/tritonserver:25.04-vllm-python-py3 base) has no
        # native implementation for Llama4ForConditionalGeneration -- it
        # silently falls back to HuggingFace Transformers' generic loader,
        # which does not shard the MoE experts across GPUs correctly and
        # OOMs on any real multi-GPU Llama4 Scout variant (FP8/INT4/etc).
        # This override is deliberately gated per-deployment (not applied to
        # the shared default) -- other deployments (triton-demo,
        # domino-inference-dev/test) use small single-GPU models that don't
        # need it, and paying the multi-minute pip-install cost on every pod
        # restart for them would be pure regression. See
        # docs/fp8_serving_configuration.md for the full version-pin reasoning.
        command:
          - bash
          - -c
          - |
            set -e
            {{- if .Values.triton_inference_server.vllm_version_override }}
            echo "Upgrading vllm to {{ .Values.triton_inference_server.vllm_version_override.vllm }} + pinning transformers=={{ .Values.triton_inference_server.vllm_version_override.transformers }}..."
            python3 -m pip install --no-cache-dir "vllm=={{ .Values.triton_inference_server.vllm_version_override.vllm }}" "transformers=={{ .Values.triton_inference_server.vllm_version_override.transformers }}"
            echo "Force-reinstalling genuine public xformers=={{ .Values.triton_inference_server.vllm_version_override.xformers }}..."
            python3 -m pip install --no-cache-dir --force-reinstall --no-deps "xformers=={{ .Values.triton_inference_server.vllm_version_override.xformers }}"
            {{- end }}
            exec /opt/tritonserver/bin/tritonserver \
              --model-repository=/triton-repo/models \
              --exit-on-error=false \
              --strict-readiness=false \
              --model-control-mode=explicit \
              --allow-grpc=true --grpc-port=8001 \
              --allow-http=true --http-port=8000 \
              --allow-metrics=true --metrics-port=8002 \
              --log-verbose=1

        resources:
          requests:
            cpu: {{ .Values.env.cores }}
            memory: "{{ .Values.env.memory }}"
            nvidia.com/gpu:  {{ .Values.env.gpu }}
          limits:
            cpu: {{ .Values.env.cores }}
            memory: "{{ .Values.env.memory }}"
            nvidia.com/gpu:  {{ .Values.env.gpu }}
        ports:
          - containerPort: 8000
            name: http
          - containerPort: 8001
            name: grpc
          - containerPort: 8002
            name: metrics

        volumeMounts:
          - mountPath: "/triton-repo"
            name: triton-repo-vol
          - mountPath: /dev/shm
            name: dshm

        startupProbe:
          httpGet:
            path: /v2/health/live
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 90  # up to ~15 min, to tolerate a cold vllm_version_override pip install

        livenessProbe:
          httpGet:
            path: /v2/health/live
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /v2/health/ready
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3

      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.env.dshm_size | default "10Gi" }}
        - name: triton-repo-vol
          persistentVolumeClaim:
            claimName: triton-repo-pvc
