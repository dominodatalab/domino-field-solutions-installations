apiVersion: v1
kind: Pod
metadata:
  name: triton-latency-efs-dynamic
  namespace: domino-compute
spec:
  restartPolicy: Never
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Exists"
      effect: "NoSchedule"
  containers:
    - name: triton
      image: nvcr.io/nvidia/tritonserver:25.04-vllm-python-py3
      command:
        - bash
        - -c
        - |
          set -e
          # Same vLLM/transformers/xformers fix as the S3-FUSE variant -- see
          # scripts/benchmarks/triton_latency_s3fuse_pod.yaml and
          # docs/fp8_serving_configuration.md for the full reasoning. This is
          # architecture/base-image level, not storage-backend-specific.
          echo "Upgrading vllm to 0.9.2 + pinning transformers==4.51.3..."
          python3 -m pip install --no-cache-dir "vllm==0.9.2" "transformers==4.51.3"
          echo "Force-reinstalling genuine public xformers==0.0.30..."
          python3 -m pip install --no-cache-dir --force-reinstall --no-deps "xformers==0.0.30"
          python3 -c "import vllm; print('vllm', vllm.__version__)"
          tritonserver --model-repository=/triton-repo/models --model-control-mode=explicit \
            --http-port=8000 --grpc-port=8001 --metrics-port=8002 &
          TRITON_PID=$!
          echo "Triton started, PID $TRITON_PID. Waiting for it to be responsive..."
          until curl -sf localhost:8000/v2/health/ready >/dev/null 2>&1; do sleep 2; done
          echo "TRITON_SERVER_READY"
          sleep 3600
      resources:
        limits:
          nvidia.com/gpu: "8"
          memory: "700Gi"
          cpu: "80"
        requests:
          nvidia.com/gpu: "8"
          memory: "700Gi"
          cpu: "80"
      volumeMounts:
        - name: bench-script
          mountPath: /scripts
        - name: config
          mountPath: /triton-repo/models/llama4scout-vllm-fp8-dynamic/config.pbtxt
          subPath: config.pbtxt
        - name: config
          mountPath: /triton-repo/models/llama4scout-vllm-fp8-dynamic/1/model.json
          subPath: model.json
        - name: weights
          # NOTE: this subPath is a placeholder -- it must point at wherever
          # the checkpoint is actually staged on the shared EFS filesystem at
          # deploy time (this test copied it under a
          # filecache/<uuid>/llama4scout-fp8-quant/weights/... path that was
          # deleted after the latency comparison completed, per this repo's
          # storage-cleanup practice -- see docs/s3_fuse_latency_test_results.md).
          # Recommendation: use the S3-FUSE variant
          # (triton_latency_s3fuse_pod.yaml) for actual serving -- EFS is
          # ~13x more expensive with no latency benefit (see that doc's
          # "Recommendation" section); this EFS pod is kept only as a
          # reference for repeating the storage-backend comparison itself.
          mountPath: /triton-repo/weights/llama4scout-vllm-fp8-dynamic
          subPath: PLACEHOLDER_EFS_PATH_TO_CHECKPOINT
          readOnly: true
        - name: dshm
          mountPath: /dev/shm
  volumes:
    - name: bench-script
      configMap:
        name: latency-bench-script
    - name: config
      configMap:
        name: triton-s3fuse-fp8-dynamic-config
    - name: weights
      persistentVolumeClaim:
        claimName: domino-shared-store-domino-compute
        readOnly: true
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 32Gi
